[project]
name = "rag-chat-service"
version = "0.1.0"
description = "Thin RAG chatbot service over ops-core-api"
readme = "README.md"
license = "MIT"
authors = [{ name = "upkero" }]
keywords = ["rag", "retrieval-augmented-generation", "fastapi", "llm", "chatbot"]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.7.0",
    "openai>=1.60.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    # Pinned, not floored: every service uses the same versions so core/telemetry.py is one file.
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
    "opentelemetry-instrumentation-httpx==0.60b1",
    "opentelemetry-instrumentation-fastapi==0.60b1",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# Namespace packages: there is no `src/__init__.py`, so mypy is told where the
# import root is instead of inferring it from the first directory without one.
explicit_package_bases = true
mypy_path = "."
# Teaches mypy that pydantic models synthesise their __init__, so settings
# classes with required fields are not reported as missing arguments.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repo root on sys.path, so `from src.app…` resolves. Stated rather than
# inferred: with no `tests/__init__.py` to stop at, pytest would otherwise have
# to work the root out by walking up from each test file.
pythonpath = ["."]

[tool.coverage.run]
source = ["src/app/services"]
