# This service is intentionally standalone — it has no database of its own.
# It only needs to reach two external dependencies configured via .env:
#   * ops-core-api (OPS_CORE_BASE_URL) — the document search backend
#   * an OpenAI-compatible LLM (LLM_BASE_URL) — e.g. OpenAI or a local Ollama
# When those run on the host, point the URLs at host.docker.internal.
services:
  rag-chat-service:
    build:
      context: .
      args:
        # Set LOCAL_MODELS=true in .env to bake in sentence-transformers (RERANK_PROVIDER=local).
        LOCAL_MODELS: ${LOCAL_MODELS:-false}
    ports:
      # Host 8001 avoids clashing with ops-core-api (8000). Loopback only: /docs and
      # /health need no key, and on Linux a port Docker publishes on 0.0.0.0 bypasses ufw.
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - hf_cache:/models  # downloaded model weights, kept across rebuilds

volumes:
  hf_cache:
